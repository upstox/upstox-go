        in: query
        description: natural language query
        required: true
        style: form
        explode: true
        schema:
          minLength: 1
          type: string
        example: RELIANCE 1500 PE
      - name: exchanges
        in: query
        description: Comma separated exchanges
        required: false
        style: form
        explode: true
        schema:
          pattern: "^(ALL|NSE|BSE|MCX)(,(ALL|NSE|BSE|MCX))*$"
          type: string
        example: "NSE,BSE,MCX"
      - name: segments
        in: query
        description: Comma separated segments
        required: false
        style: form
        explode: true
        schema:
          pattern: "^(ALL|EQ|FO|CURR|COMM|INDEX|OPT|FUT|OPTION_CHAIN)(,(ALL|EQ|FO|CURR|COMM|INDEX|OPT|FUT|OPTION_CHAIN))*$"
          type: string
        example: "EQ,FO,CURR,COMM"
      - name: instrument_types
        in: query
        description: Comma separated instrument types
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: "CE,PE"
      - name: expiry
        in: query
        description: "expiry in format: yyyy-MM-dd"
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 2025-12-28
      - name: atm_offset
        in: query
        description: page number greater than or equal to 1
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 2
      - name: page_number
        in: query
        description: "ATM offset number for queries like ATM, ATM+1, ATM-1, etc."
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
