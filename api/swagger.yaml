        total: 3
        payload_error: 0
        success: 2
        error: 1
    TokenRequest:
      required:
      - client_id
      - client_secret
      - code
      - grant_type
      - redirect_uri
      type: object
      properties:
        code:
          minLength: 1
          type: string
        client_id:
          minLength: 1
          type: string
          description: OAuth API key that is a public identifier for app
        client_secret:
          minLength: 1
          type: string
          description: OAuth client secret that is a private secret known only to
            app and authorization server
        redirect_uri:
          minLength: 1
          type: string
          description: Authorization server will redirect the user back to the application
            via redirect url
        grant_type:
          minLength: 1
          type: string
          description: Type of grant used to get an access token
        refresh_extended_token:
          type: boolean
          description: Whether to refresh (regenerate) the extended access token.
            Defaults to false when absent. Set to true to refresh; false or omit to
            reuse an existing extended token when available.
    IpoApplyRequest:
      required:
      - bids
      - category
      - id
