          should fall under the same financial year as mentioned in financial_year
          attribute. Date in dd-mm-yyyy format
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 01-04-2022
      - name: to_date
        in: query
        description: Date till which data needs to be fetched. from_date and to_date
          should fall under the same financial year as mentioned in financial_year
          attribute. Date in dd-mm-yyyy format
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 31-03-2023
