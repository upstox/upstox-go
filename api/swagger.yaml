          type: string
          description: "Lifecycle stage of the application. Known values: awaiting_mandate,\
            \ ipo_allotted, ipo_not_allotted, application_deleted"
          example: ipo_allotted
        order_status:
          type: string
          description: "Outcome of the application. Known values: success, allotted,\
            \ not_allotted"
          example: allotted
        payment_status:
          type: string
          description: "State of the UPI mandate backing the application. Known values:\
            \ pending, mandate_accepted"
          example: mandate_accepted
        category:
          type: string
          description: Investor category the application was placed under. IND (individual)
            and HNI can be applied for; EMP appears on employee-quota applications
          example: IND
        issue_type:
          type: string
          description: Issue type of the IPO. `regular` is a mainboard issue
          example: regular
          enum:
          - regular
          - sme
        reason:
          type: string
          description: Free-text reason from the exchange or registrar explaining
            the current status
          example: alloted
        upi:
          type: string
          description: UPI id the mandate was raised against
          example: 9136776254@ybl
        upi_amount_blocked:
          type: string
          description: "Amount blocked in the applicant's bank account for this application,\
            \ as a decimal string. Absent until the mandate is accepted"
          example: "14819.0"
        nse_submitted_date:
          type: string
          description: "When the application was submitted to NSE, in yyyy-MM-dd'T'HH:mm:ss;\
            \ null if not submitted there"
          example: 2024-10-21T08:14:20
        bse_submitted_date:
          type: string
          description: "When the application was submitted to BSE, in yyyy-MM-dd'T'HH:mm:ss;\
            \ null if not submitted there"
          example: 2024-10-21T08:14:20
        mandate_approved_date:
          type: string
          description: When the UPI mandate was approved; null until approved
          example: 2024-10-21T09:02:11
        rejection_date:
          type: string
          description: When the application was rejected; null unless rejected
          example: 2024-10-22T11:30:00
        mandate_rejection_date:
          type: string
          description: When the UPI mandate was rejected; null unless rejected
          example: 2024-10-22T11:30:00
        cancel_requested_date:
          type: string
          description: When cancellation was requested; null unless a cancellation
            was raised
          example: 2024-10-23T10:15:00
        cancel_accepted_date:
          type: string
          description: When cancellation was accepted; null unless the cancellation
            completed
          example: 2024-10-23T10:45:00
        units_allotted:
          type: integer
          description: "Shares allotted. 0 until allotment completes, and on applications\
            \ that were not allotted"
          format: int32
          example: 73
        bids:
          type: array
          description: Bids placed in this application
          items:
            $ref: "#/components/schemas/IpoOrderBid"
        created_at:
          type: string
          description: "When the application was created, in yyyy-MM-dd'T'HH:mm:ss"
