      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: "IPO id (slug) to apply for, as returned in `id` by the IPO\
            \ listing and details APIs"
          example: mandb-engineering-limited-ipo
        upi:
          minLength: 1
          type: string
          description: UPI id used to block the application amount
