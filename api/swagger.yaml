        required: true
        style: simple
        explode: false
        schema:
          pattern: "^(?:NSE_EQ|NSE_FO|NCD_FO|BSE_EQ|BSE_FO|BCD_FO|MCX_FO|NSE_INDEX|BSE_INDEX|MCX_INDEX|NSE_COM)\\\
            |[\\w\\d\\-]+\\|(0[1-9]|[12]\\d|3[01])-(0[1-9]|1[012])-(\\d{4})$"
          type: string
        example: NSE_EQ|INE848E01016|24-04-2025
      - name: interval
        in: path
        description: Interval to get expired ohlc data
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^(1minute|3minute|5minute|15minute|30minute|day)$
          type: string
        example: day
      - name: to_date
        in: path
        description: to date
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^(\\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          type: string
        example: 2025-01-01
      - name: from_date
        in: path
        description: from date
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^(\\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          type: string
        example: 2024-01-01
