  /v2/user/kill-switch:
    get:
      tags:
      - User
      summary: Get kill switch status
      description: Returns the disable/enable status of all trading segments for the
        user.
      operationId: getKillSwitch
      responses:
        "405":
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiGatewayErrorResponse"
        "400":
          description: UDAPI1181 - The specified segment does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiGatewayErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
