components:
  schemas:
    ApiGatewayErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    Problem:
      type: object
      properties:
        message:
          type: string
          description: Verbose message for the error state
        error_code:
          type: string
        property_path:
          type: string
        invalid_value: {}
      example:
        property_path: property_path
        error_code: error_code
        invalid_value: ""
        message: message
    ModifyOrderRequest:
      required:
      - order_id
      - order_type
      - price
      - trigger_price
      - validity
      type: object
      properties:
        quantity:
          type: integer
          description: Quantity with which the order was placed
          format: int32
          example: 1
        validity:
          type: string
          description: Order validity (DAY- Day and IOC- Immediate or Cancel (IOC)
            order)
          example: DAY
          enum:
          - DAY
          - IOC
        price:
          type: number
          description: Price at which the order was placed
          format: float
          example: 120.01
        order_id:
          type: string
          description: The order ID for which the order must be modified
          example: "1644490272000"
        order_type:
          type: string
          description: |-
            Type of order. It can be one of the following
            MARKET refers to market order
            LIMILT refers to Limit Order
            SL refers to Stop Loss Limit
            SL-M refers to Stop Loss Market
          example: MARKET
          enum:
          - MARKET
          - LIMIT
          - SL
          - SL-M
        disclosed_quantity:
          type: integer
          description: The quantity that should be disclosed in the market depth
          format: int32
          example: 0
        trigger_price:
          type: number
          description: If the order is a stop loss order then the trigger price to
            be set is mentioned here
          format: float
          example: 0
        market_protection:
          maximum: 25
          minimum: -1
          type: number
          description: Optional market price protection percentage; -1 lets the exchange
            decide
          format: float
    ModifyOrderData:
      type: object
      properties:
        order_id:
          type: string
          description: Order ID
          readOnly: true
          example: "1644490272000"
      example:
        order_id: "1644490272000"
    ModifyOrderV3Response:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          $ref: "#/components/schemas/ModifyOrderData"
        metadata:
          $ref: "#/components/schemas/OrderMetadata"
      example:
        metadata:
          latency: 0
        data:
          order_id: "1644490272000"
        status: success
    OrderMetadata:
      type: object
      properties:
        latency:
          type: integer
          format: int64
      example:
        latency: 0
    GttModifyOrderRequest:
      required:
      - gtt_order_id
      - quantity
      - rules
      - type
      type: object
      properties:
        type:
          type: string
          description: |-
            Type of GTT order. It can be one of the following:
            SINGLE refers to a single-leg GTT order
            MULTIPLE refers to a multi-leg GTT order
          example: SINGLE
          enum:
          - SINGLE
          - MULTIPLE
        quantity:
          type: integer
          description: Quantity with which the order is to be placed
          format: int32
          example: 1
        rules:
          type: array
          description: List of rules defining the conditions for each leg in the GTT
            order
          items:
            $ref: "#/components/schemas/GttRule"
        gtt_order_id:
          pattern: ^GTT-.+$
          type: string
          description: Unique identifier of the GTT order to be modified
          example: GTT-12345678
    GttRule:
      required:
      - strategy
      - trigger_price
      - trigger_type
      type: object
      properties:
        strategy:
          type: string
          description: |-
            Defines the strategy for the GTT order leg:
            ENTRY - First leg order
            STOPLOSS - Stop-loss order
            TARGET - Target order
          example: ENTRY
          enum:
          - ENTRY
          - STOPLOSS
          - TARGET
        trigger_type:
          type: string
          description: Trigger type for each leg of the order
          example: ABOVE
          enum:
          - ABOVE
          - BELOW
          - IMMEDIATE
        trigger_price:
          type: number
          description: Trigger price for the GTT order leg
          format: double
          example: 1500.5
        trailing_gap:
          type: number
          description: Optional parameter defining the trailing gap for the GTT order
          format: double
          example: 0.5
        market_protection:
          maximum: 25
          minimum: -1
          type: number
          description: Optional parameter defining the market protection percentage
            for the GTT order
          format: double
          example: 3
    GttOrderData:
      type: object
      properties:
        gtt_order_ids:
          type: array
          description: Order ID for the placed GTT order
          readOnly: true
          example: GTT-221130000253265
          items:
            type: string
      example:
        gtt_order_ids: GTT-221130000253265
    GttTriggerOrderResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          $ref: "#/components/schemas/GttOrderData"
        metadata:
          $ref: "#/components/schemas/OrderMetadata"
      example:
        metadata:
          latency: 0
        data:
          gtt_order_ids: GTT-221130000253265
        status: success
    ModifyPayoutRequest:
      required:
      - amount
      type: object
      properties:
        amount:
          minimum: 100.0
          type: number
          description: Withdrawal amount in INR
          format: double
          example: 5000.0
    PayoutDetails:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        eta:
          type: string
        message:
          type: string
        transaction_id:
          type: string
        created_at:
          type: string
        bank_name:
          type: string
        transaction_fee:
          type: string
      example:
        mode: mode
        transaction_id: transaction_id
        amount: 0.8008281904610115
        eta: eta
        bank_name: bank_name
        created_at: created_at
        transaction_fee: transaction_fee
        currency: currency
        message: message
        status: status
    PayoutDetailsResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
